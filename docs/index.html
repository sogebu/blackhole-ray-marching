<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Schwarzschild real-time viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
               font: 13px/1.4 -apple-system, "Hiragino Sans", sans-serif; }
  #gl { width: 100vw; height: 100vh; display: block; cursor: grab; }
  #panel { position: fixed; top: 10px; left: 10px; color: #ddd;
           background: rgba(10,14,24,.72); padding: 10px 14px;
           border-radius: 8px; user-select: none; max-width: 540px; }
  #panel label { display: block; margin: 4px 0; }
  #hud { position: fixed; bottom: 10px; left: 10px; color: #cfd6e4;
         background: rgba(10,14,24,.6); padding: 6px 10px; border-radius: 6px;
         font-variant-numeric: tabular-nums; }
  input[type=range] { width: 190px; vertical-align: middle; }
  .note { color: #8a93a6; font-size: 11px; }
  .note a { color: #a9b8d6; }
  #skycredit { max-width: 360px; margin: 0 0 4px; }
  #lang { color: #a9b8d6; margin-left: 6px; }
  #fold { float: right; margin-left: 10px; }
  #panel.folded #panelbody, #panel.folded [data-t="tagline"], #panel.folded #lang { display: none; }
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<div id="panel">
  <button id="fold">畳む (H)</button>
  <b>Schwarzschild viewer</b> <span class="note" data-t="tagline">(f32 lookup、horizon 貫通対応)</span>
  <a id="lang" class="note" href="?lang=en">English</a>
  <div id="panelbody">
  <label>R = <span id="Rval"></span> r<sub>S</sub> <span class="note" data-t="rnote">(スライダは 0.001〜100、飛行に上限なし)</span><br>
    <input id="R" type="range" min="0" max="1" step="any"></label>
  <label><input id="ffo" type="checkbox" checked> <span data-t="ffo">自由落下カメラ (FFO)</span></label>
  <label><input id="free" type="checkbox"> <span data-t="free">自由飛行</span> <span class="note" data-t="freenote">(地平面の内側まで。内側は自由落下系が基準、推力は E・L を変える)</span></label>
  <label><button id="orbit" data-t="orbit">C: 円軌道</button> <button id="hover"><span data-t="hover">0: 静止</span> <span class="note" data-t="hovernote">(内側は E = 0)</span></button></label>
  <label hidden><input id="dop" type="checkbox"> <span data-t="dop">ドップラー効果</span> <span class="note" data-t="dopnote">(色 + 明るさ g&#8308;)</span></label>
  <label><input id="eternal" type="checkbox"> <span data-t="eternal">永久 BH</span> <span class="note" data-t="eternalnote">(あの世 mode、現実の BH は崩壊型 = OFF)</span></label>
  <label><input id="disk" type="checkbox"> <span data-t="disk">降着円盤</span> <span class="note" data-t="disknote">(Kepler 円盤 ISCO&ndash;12 r<sub>S</sub>)</span></label>
  <label><span data-t="inc">円盤の傾き</span> <span id="incval"></span>&deg;
    <input id="inc" type="range" min="0" max="89" step="1" value="80"></label>
  <label><span data-t="mass">質量</span> <select id="mass">
      <option value="sun" data-t="sun">太陽</option>
      <option value="SgrA" selected>Sgr A*</option>
      <option value="M87">M87*</option>
    </select> <span class="note" data-t="massnote">(時間の秒換算のみ、絵は不変)</span></label>
  <label><span data-t="sky">空</span> <select id="sky">
      <option value="milkyway" selected data-t="milkyway">天の川 (Gaia の実データ)</option>
      <option value="grid" data-t="grid">格子 (15&deg; ごと)</option>
    </select> <span id="skynote" class="note"></span></label>
  <div id="skycredit" class="note"><span data-t="skyimage">天の川の画像:</span>
    <a href="https://commons.wikimedia.org/wiki/File:Milkyway360-latlon-32kscaled8k-4200k-m14-s4-g1.png" target="_blank" rel="noopener">Kevin M. Loch</a>
    (bsrender<span data-t="comma">、</span>ESA Gaia EDR3)<span data-t="comma">、</span>
    <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a><span data-t="comma">、</span>
    <span data-t="skyview">縮小して使用。初期視点では BH が銀河の回転の向き (l = 90&deg;) の銀河面 30&deg; 上、銀河中心は右手 90&deg;。</span></div>
  <label>fov <span id="fovval"></span>&deg;
    <input id="fov" type="range" min="30" max="150" step="1" value="100"></label>
  <label><button id="fall">▶ 自由落下</button>
    <span class="note"><span data-t="tau">固有時間</span> ×<span id="spdval"></span></span>
    <input id="spd" type="range" min="0" max="1" step="any" value="0.5"
           style="width:110px"></label>
  <div class="note" data-t="help">drag・矢印: 自分の周りを見回し / wheel: fov / 自由飛行: W/S 前後、A/D 左右（離すと減速）／固有時間は選んだ質量の実時間 ×倍率（既定 1）で進む</div>
  </div>
</div>
<div id="hud"></div>
<script>
"use strict";
// ---- language: ?lang=en|ja, else the browser's (ja* -> ja, otherwise en).
// The Japanese panel text is the markup itself; with LANG = en every
// [data-t] element takes I18N.en[key].  Strings written at run time (HUD,
// camera messages, the fall button) come from t(key, ...args) in both
// languages.  The link next to the title reloads the page in the other one.
const LANG = (() => {
  const q = new URLSearchParams(location.search).get("lang");
  if (q === "en" || q === "ja") return q;
  return /^ja\b/i.test(navigator.language || "") ? "ja" : "en";
})();
const I18N = {
  ja: {
    webgl2: "WebGL2 が必要です",
    error: "エラー: ",
    binSize: (name, got, want) => `${name}.bin の大きさが meta.json と合いません ` +
      `(${got} B、期待 ${want} B)。再読み込みしてください`,
    metaOld: "meta.json が古い版です (disk_scat_q0 などが無い)。" +
      "renderer/web で python3 export_table.py を回し直してください",
    skyLoading: "読み込み中…",
    skyFailed: "画像を読み込めませんでした",
    rate1: (mass, unit) => `1（${mass} の実時間、${unit}）`,
    rateUp: (m, mass) => `${m}（${mass} の実時間の ${m} 倍速）`,
    rateDown: (m, mass, inv) => `${m}（${mass} の実時間の 1/${inv}）`,
    min: "分", hour: "時間", day: "日",
    fall: "▶ 自由落下", stop: "■ 停止",
    fold: "畳む (H)", unfold: "開く (H)",
    endDeep: "r = 0.001 rS（interior table の下端）で飛行終了",
    endGamma: (r, g) => `r = ${r} rS: 自由落下系に対する速度が光速に近づき (γ > ${g})、表示の限界で飛行終了`,
    noFlyDeep: "r = 0.001 rS（table の下端）からは飛べません",
    flyInside: "地平面の近く／内側: 自由落下系に静止して開始（推力は E・L を変える）",
    flyHere: "現在位置で自由飛行を開始（重力補償中）",
    orbitMin: "C の安定円軌道は R > 3 rS で使えます",
    orbitOn: "円軌道に入りました",
    restInside: "t と φ で静止（E = 0, L = 0）= 内側で最も長く生きる落下",
    noHover: "地平面の直上 (1 ≤ R < 1.02) では静止できません",
    hovering: "静止（重力補償中）",
    sliderStatic: "R < 1.02 rS: スライダでは静止カメラ（自由飛行を終了）",
    sliderMove: "スライダの R へ移動（静止、重力補償中）",
    flyPaused: "自由飛行を一時停止",
    hudFlyIn: "自由飛行（自由落下系基準）",
    hudFly: "自由飛行",
    noStatic: "地平面の内側では静止できないので自由落下の視界",
  },
  en: {
    tagline: "(f32 lookup, through the horizon)",
    rnote: "(slider 0.001&ndash;100; no upper limit in flight)",
    ffo: "Free-fall camera (FFO)",
    free: "Free flight",
    freenote: "(down through the horizon; inside, the free-fall frame is the reference and thrust changes E and L)",
    orbit: "C: circular orbit",
    hover: "0: hover",
    hovernote: "(inside: E = 0)",
    dop: "Doppler effect",
    dopnote: "(color + brightness g&#8308;)",
    eternal: "Eternal BH",
    eternalnote: "(shows the far exterior; a real, collapse-formed BH = OFF)",
    disk: "Accretion disk",
    disknote: "(Keplerian disk, ISCO&ndash;12 r<sub>S</sub>)",
    inc: "Disk inclination",
    mass: "Mass",
    sun: "Sun",
    massnote: "(sets only the time in seconds; the image does not change)",
    sky: "Sky",
    milkyway: "Milky Way (real Gaia data)",
    grid: "Grid (every 15&deg;)",
    skyimage: "Milky Way image:",
    comma: ", ",
    skyview: "downscaled. In the initial view the BH lies 30&deg; above the Galactic plane " +
      "toward the Galactic rotation (l = 90&deg;); the Galactic center is 90&deg; to the right.",
    tau: "Proper time",
    help: "Drag or arrow keys: look around / wheel: fov / free flight: W/S forward/back, " +
      "A/D left/right (release to slow down) / proper time runs at the real rate for the chosen mass " +
      "&times; the multiplier (default 1)",
    webgl2: "WebGL2 is required",
    error: "Error: ",
    binSize: (name, got, want) => `${name}.bin does not match meta.json in size ` +
      `(${got} B, expected ${want} B). Please reload`,
    metaOld: "meta.json is an old version (no disk_scat_q0 etc.). " +
      "Run python3 export_table.py in renderer/web again",
    skyLoading: "loading…",
    skyFailed: "could not load the image",
    rate1: (mass, unit) => `1 (real time for ${mass}, ${unit})`,
    rateUp: (m, mass) => `${m} (${m}× real time for ${mass})`,
    rateDown: (m, mass, inv) => `${m} (1/${inv} of real time for ${mass})`,
    min: "min", hour: "h", day: "days",
    fall: "▶ Free fall", stop: "■ Stop",
    fold: "Hide (H)", unfold: "Show (H)",
    endDeep: "Flight ended at r = 0.001 rS (the end of the interior table)",
    endGamma: (r, g) => `r = ${r} rS: speed relative to the free-fall frame near c (γ > ${g}); flight ended at the display limit`,
    noFlyDeep: "Cannot fly from r = 0.001 rS (the end of the table)",
    flyInside: "Near or inside the horizon: starting at rest in the free-fall frame (thrust changes E and L)",
    flyHere: "Free flight from here (gravity-compensated hover)",
    orbitMin: "C (stable circular orbit) works for R > 3 rS",
    orbitOn: "On a circular orbit",
    restInside: "At rest in t and φ (E = 0, L = 0) = the longest-lived fall inside",
    noHover: "Cannot hover just above the horizon (1 ≤ R < 1.02)",
    hovering: "Hovering (gravity-compensated)",
    sliderStatic: "R < 1.02 rS: the slider shows the static camera (free flight ended)",
    sliderMove: "Moved to the slider's R (gravity-compensated hover)",
    flyPaused: "Free flight paused",
    hudFlyIn: "Free flight (free-fall frame)",
    hudFly: "Free flight",
    noStatic: "No static observer inside the horizon: free-fall view",
  },
};
const t = (key, ...args) => {
  const v = I18N[LANG][key];
  return typeof v === "function" ? v(...args) : v;
};
document.documentElement.lang = LANG;
if (LANG === "en")
  for (const e of document.querySelectorAll("[data-t]")) e.innerHTML = I18N.en[e.dataset.t];
{
  const other = LANG === "en" ? "ja" : "en";
  const link = document.getElementById("lang");
  link.href = "?lang=" + other;
  link.textContent = other === "en" ? "English" : "日本語";
}
document.getElementById("fall").textContent = t("fall");
// The panel folds to its title line (button or H) to clear the view.
function toggleFold(){
  const folded = document.getElementById("panel").classList.toggle("folded");
  document.getElementById("fold").textContent = t(folded ? "unfold" : "fold");
}
document.getElementById("fold").textContent = t("fold");
document.getElementById("fold").addEventListener("click", () => {
  toggleFold(); document.getElementById("gl").focus();
});

const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", { preserveDrawingBuffer: true });
if (!gl) document.body.innerHTML = t("webgl2");

const VS = `#version 300 es
in vec2 aPos; out vec2 vNdc;
void main(){ vNdc = aPos; gl_Position = vec4(aPos, 0., 1.); }`;

const FS = `#version 300 es
precision highp float;
in vec2 vNdc; out vec4 frag;
uniform sampler2D uTab;
uniform sampler2D uIntTab;   // interior (r, chi) -> (psi, g, fate, 0)
uniform sampler2D uIntR;     // interior r grid (1 x int_nR), ascending
uniform sampler2D uUS;       // disk: u(sigma) from periastron   (scattering)
uniform sampler2D uAS;       // disk: azimuth(v = sqrt(r - p))   (scattering)
uniform sampler2D uUC;       // disk: u(sigma) from the horizon  (plunging)
uniform sampler2D uAC;       // disk: azimuth(ln(r - 1))         (plunging)
uniform sampler2D uAux;      // disk: per-row (p, arc_scat, arc_cap, 0)
uniform float uNR, uNT, uLogRmin, uLogRmax, uT0, uBcr;
uniform float uIntNR, uIntNChi;
uniform float uDNY, uDNS, uDNV, uDY0, uDY1, uDZ0, uDZ1;
uniform float uDVmax, uDW0, uDW1, uDBmax;
uniform float uRin, uRout, uTmax, uExpo, uDiskRmax;
uniform float uDiskBq;               // plunging rays: y = ln w quadrature below this b
uniform float uDiskYarc;             // ln(1/r) where each tabulated arc ends (40.5)
uniform float uDiskXarc;             // 1/40.5 - 2/3 (the plunging azimuth's far end)
uniform float uDiskEps0;             // |b - b_cr| of the tables' first row (1e-8)
uniform float uDiskWp0, uDiskTw0;    // that row's scattering ray: w_p0, 2 - 3 w_p0
uniform float uDiskAtabR;            // camera azimuth from the A tables at R_t >= this
                                     // (1e30 = never; fallback knob, >= 2.5 only)
uniform float uDiskRmin;             // disk drawn for camera R > this (0 = always;
                                     // 1.52 = the pre-2026-10-13 photon-sphere gate)
uniform int uDiskProbe;              // machine check: 1 = r, 2 = g, 3 = k + 1 of the hit
uniform float uRref, uBsplit;        // far field: table end R_ref, table/turning split
uniform vec3 uZd;                    // disk normal (world frame)
uniform float uR, uTanHalf, uAspect;
uniform vec3 uFwd, uRight, uUp, uBhat, uBeta;
uniform bool uFFO, uFlying, uDop, uEternal, uDisk;   // uEternal: keep regions III/IV
uniform bool uFlyIn;                 // powered pilot below R_SWITCH: uBeta is its
                                     // velocity relative to the free-fall frame
uniform bool uProbe;                 // machine check: output psi, not colour
uniform sampler2D uSkyImg;           // photo sky (equirectangular, galactic)
uniform bool uSkyImage;              // true: photo sky, false: 15-deg grid
uniform float uSkyW;                 // photo sky width in texels (mip level 0)
const float PI = 3.141592653589793;
uniform float uEngineR;              // falling camera: interior engine below this
                                     // radius = the psi table's R_min (meta)
const vec3 SKY_NORTH = vec3(0.0, 0.0, 1.0);  // fixed celestial coordinate frame

float psiLookup(float R, float t){
  float ur = (log(R) - uLogRmin) / (uLogRmax - uLogRmin) * (uNR - 1.0);
  float ut = (t - uT0) / (1.0 - uT0) * (uNT - 1.0);
  ur = clamp(ur, 0.0, uNR - 1.0001);
  ut = clamp(ut, 0.0, uNT - 1.0001);
  float i0 = floor(ur), j0 = floor(ut);
  float fr = ur - i0, ft = ut - j0;
  int i = int(i0), j = int(j0);
  float p00 = texelFetch(uTab, ivec2(j,     i    ), 0).r;
  float p01 = texelFetch(uTab, ivec2(j + 1, i    ), 0).r;
  float p10 = texelFetch(uTab, ivec2(j,     i + 1), 0).r;
  float p11 = texelFetch(uTab, ivec2(j + 1, i + 1), 0).r;
  return mix(mix(p00, p01, ft), mix(p10, p11, ft), fr);
}

float edgeOf(float R){
  float A = 1.0 - 1.0 / R;
  float acr = asin(clamp(uBcr * sqrt(A) / R, 0.0, 1.0));
  return (R > 1.5) ? acr : PI - acr;
}

// ---- far field: camera R > uRref, where the psi table ends.  That end is a
// texture boundary, not a physical one.  Python f64 reference = psi_far.py
// (same scheme, same conditioning; its docstring derives both and the
// export gate bounds this f32 port).  Phi(w1, w2) = int dw [1/b^2 - w^2 (1-w)]^-1/2
// by 12-point Gauss-Legendre, (A) plain in w or (B) in t with w = w_p - t^2.
const float GLX[6] = float[6](0.1252334085114689, 0.3678314989981802,
  0.5873179542866175, 0.7699026741943047, 0.9041172563704748, 0.9815606342467192);
const float GLW[6] = float[6](0.2491470458134027, 0.2334925365383546,
  0.2031674267230656, 0.1600783285433461, 0.1069393259953189, 0.0471753363865120);

float phiW(float ib2, float w1, float w2){
  float c = 0.5 * (w1 + w2), h = 0.5 * (w2 - w1), s = 0.0;
  for (int k = 0; k < 6; ++k) {
    float wa = c - h * GLX[k], wb = c + h * GLX[k];
    s += GLW[k] * (inversesqrt(max(ib2 - wa * wa * (1.0 - wa), 1e-30))
                 + inversesqrt(max(ib2 - wb * wb * (1.0 - wb), 1e-30)));
  }
  return h * s;
}
// 1/b^2 - w^2 + w^3 = (w_p - w) Q(w): Q stays positive on the exterior branch
float qOf(float wp, float w){ return (1.0 - wp) * (wp + w) - w * w; }
float phiT(float wp, float tlo, float h){   // t in [tlo, tlo + 2h]
  float c = tlo + h, s = 0.0;
  for (int k = 0; k < 6; ++k) {
    float ta = c - h * GLX[k], tb = c + h * GLX[k];
    s += GLW[k] * (inversesqrt(max(qOf(wp, wp - ta * ta), 1e-30))
                 + inversesqrt(max(qOf(wp, wp - tb * tb), 1e-30)));
  }
  return 2.0 * h * s;
}
// w_p = 1/periastron: monotone fixed point from 1/b (exact wherever (B) uses
// it); -1 = no turning point.  No p^3 here: it overflows f32 at large b.
float wPeri(float b){
  if (b <= uBcr) return -1.0;
  float ib2 = 1.0 / (b * b), w = 1.0 / b;
  for (int k = 0; k < 12; ++k) w = sqrt(ib2 / (1.0 - w));
  return w;
}
// the table's last row (R = uRref exactly), linear in t
float psiRef(float chiRef){
  float edge = edgeOf(uRref);
  float t = sqrt(max(chiRef - edge, 0.0) / (PI - edge));
  float ut = clamp((t - uT0) / (1.0 - uT0) * (uNT - 1.0), 0.0, uNT - 1.0001);
  float j0 = floor(ut);
  int j = int(j0), i = int(uNR) - 1;
  return mix(texelFetch(uTab, ivec2(j, i), 0).r,
             texelFetch(uTab, ivec2(j + 1, i), 0).r, ut - j0);
}
// c = cos(chi_st), s = sin(chi_st); the caller has excluded the shadow
float psiFar(float R, float c, float s){
  float w = 1.0 / R, A = 1.0 - w;
  float b = R * s * inversesqrt(A);
  float ib2 = 1.0 / (b * b);
  float wp = wPeri(b);
  // t_R = sqrt(w_p - w_R) from (w_p - w_R) Q(w_R) = w_R^2 A cot^2 chi: taken
  // from cos(chi), never as a difference (sin chi = 1 in f32 near 90 deg)
  float tR = (wp > 0.0)
    ? w * sqrt(A) * abs(c) / (s * sqrt(max(qOf(wp, w), 1e-30))) : 0.0;
  float wRef = 1.0 / uRref;
  if (c > 0.0 && b <= uBsplit) {
    // table branch: the ray reaches R_ref at chi_ref <= 41 deg; add the leg
    float chiRef = asin(min(b * sqrt(1.0 - wRef) * wRef, 1.0));
    float leg;
    if (wp < 0.0 || wRef <= 0.5 * wp) leg = phiW(ib2, w, wRef);
    else {
      float tRef = sqrt(max(wp - wRef, 0.0));
      leg = phiT(wp, tRef, 0.5 * (wRef - w) / (tR + tRef));
    }
    return psiRef(chiRef) + leg;
  }
  float phiOut;                                  // Phi(0, w_R)
  if (wp < 0.0 || w <= 0.5 * wp) phiOut = phiW(ib2, 0.0, w);
  else phiOut = phiT(wp, tR, 0.5 * w / (sqrt(wp) + tR));
  if (c <= 0.0) return phiOut;                   // outgoing view
  return phiOut + 2.0 * phiT(wp, 0.0, 0.5 * tR); // turning: + 2 Phi(w_R, w_p)
}

// machine-check channel: psi -> 24-bit fixed point over RGB (0 = shadow)
vec4 encodePsi(float psi, bool dark){
  if (dark) return vec4(0.0, 0.0, 0.0, 1.0);
  float x = floor(clamp((psi + 1.0) / 16.0, 0.0, 0.99999994) * 16777216.0);
  float r = floor(x / 65536.0); x -= r * 65536.0;
  float g = floor(x / 256.0);
  return vec4(r, g, x - g * 256.0, 255.0) / 255.0;
}

// interior engine: binary-search the non-uniform r grid, then same-fate
// bilinear over the 4 surrounding nodes (no blending across the belt edges,
// same contract as render_interior.paint)
vec3 intLookup(float R, float chi){
  int nR = int(uIntNR);
  int lo = 0, hi = nR - 1;
  for (int it = 0; it < 9; ++it) {
    if (hi - lo <= 1) break;
    int mid = (lo + hi) / 2;
    float rm = texelFetch(uIntR, ivec2(mid, 0), 0).r;
    if (rm <= R) lo = mid; else hi = mid;
  }
  float r0 = texelFetch(uIntR, ivec2(lo, 0), 0).r;
  float r1 = texelFetch(uIntR, ivec2(hi, 0), 0).r;
  float wr = clamp((R - r0) / max(r1 - r0, 1e-9), 0.0, 1.0);
  float uc = clamp(chi / PI * (uIntNChi - 1.0), 0.0, uIntNChi - 1.0001);
  int j = int(floor(uc));
  float wc = uc - float(j);
  vec4 p00 = texelFetch(uIntTab, ivec2(j,     lo), 0);
  vec4 p01 = texelFetch(uIntTab, ivec2(j + 1, lo), 0);
  vec4 p10 = texelFetch(uIntTab, ivec2(j,     hi), 0);
  vec4 p11 = texelFetch(uIntTab, ivec2(j + 1, hi), 0);
  bool same = (p00.z == p01.z) && (p00.z == p10.z) && (p00.z == p11.z);
  if (same) {
    vec4 v = mix(mix(p00, p01, wc), mix(p10, p11, wc), wr);
    return vec3(v.x, v.y, p00.z);
  }
  // nearest node across a fate boundary
  vec4 v = (wr < 0.5) ? ((wc < 0.5) ? p00 : p01) : ((wc < 0.5) ? p10 : p11);
  return vec3(v.x, v.y, v.z);
}

// ---- chromatic Doppler: Nakayama-Oda PTEP 2017 Sec. 5.4 (per-channel
// color-temperature shift; python reference = doppler_rgb.py, same formulas.
// channel floor 1/255 here (f32 pow range), 1e-3 in the f64 reference).
float bbR(float T){
  return (T < 6688.0) ? 255.0
       : 329.70 * pow(max(T - 6000.0, 1e-6) / 100.0, -0.133205);
}
float bbG(float T){
  if (T < 505.0) return 0.0;
  if (T < 6503.0) return 99.47 * log(T / 100.0) - 161.12;
  return 287.12 * pow((T - 6000.0) / 100.0, -0.0755148);
}
float bbB(float T){
  if (T < 1904.0) return 0.0;
  if (T < 6700.0) return 138.52 * log((T - 1000.0) / 100.0) - 305.04;
  return 255.0;
}
float TofR(float R){
  return (R >= 254.999) ? 6688.0
       : 6000.0 + 100.0 * pow(max(R, 1.0) / 329.70, -1.0 / 0.133205);
}
float TofG(float G, bool warm){
  G = clamp(G, 1.0, 254.16);
  if (warm) return 100.0 * exp((G + 161.12) / 99.47);   // lower-T log branch
  return 6000.0 + 100.0 * pow(G / 287.12, -1.0 / 0.0755148);
}
float TofB(float B){
  if (B >= 254.999) return 6700.0;
  if (B <= 1.0) return 1904.0;
  return 1000.0 + 100.0 * exp((B + 305.04) / 138.52);
}
vec3 dopplerShift(vec3 c, float g){
  vec3 C = clamp(c, 0.0, 1.0) * 255.0;
  bool warm = C.r > C.b;                    // footnote 38 branch rule
  return clamp(vec3(bbR(TofR(C.r) * g),
                    bbG(TofG(C.g, warm) * g),
                    bbB(TofB(C.b) * g)) / 255.0, 0.0, 1.0);
}

// ---- accretion disk (python reference: disk_table.py disk_hit / disk_ray,
// an f32 emulation of this code; pixel invariants in every frame: disk.py
// pixel_invariants; physics SoT: BH_shooter.tex Sec. 5).  Orbits are
// b-anchored: the U tables carry each orbit's shape u(sigma) and the AUX row
// its total arc, for every camera radius; the camera's own azimuth along the
// orbit (anchor -> camera) is a short quadrature here, on both sides of the
// horizon (DESIGN.md "光子球の内側・地平面の内側から見た円盤").  The A tables
// are bound but read only when uDiskAtabR says so (a fallback knob).
float fetchBilin(sampler2D tex, float rowf, float colf, float nrow, float ncol){
  rowf = clamp(rowf, 0.0, nrow - 1.0001);
  colf = clamp(colf, 0.0, ncol - 1.0001);
  float i0 = floor(rowf), j0 = floor(colf);
  float fr = rowf - i0, fc = colf - j0;
  int i = int(i0), j = int(j0);
  float p00 = texelFetch(tex, ivec2(j,     i    ), 0).r;
  float p01 = texelFetch(tex, ivec2(j + 1, i    ), 0).r;
  float p10 = texelFetch(tex, ivec2(j,     i + 1), 0).r;
  float p11 = texelFetch(tex, ivec2(j + 1, i + 1), 0).r;
  return mix(mix(p00, p01, fc), mix(p10, p11, fc), fr);
}

vec3 auxFetch(float rowf){
  rowf = clamp(rowf, 0.0, uDNY - 1.0001);
  float i0 = floor(rowf); int i = int(i0);
  vec4 a0 = texelFetch(uAux, ivec2(i, 0), 0);
  vec4 a1 = texelFetch(uAux, ivec2(i + 1, 0), 0);
  return mix(a0, a1, rowf - i0).xyz;
}

// periastron p^3 = b^2 (p - 1): Newton from p0 = b converges monotonically.
// p must NOT be interpolated from the AUX column (exponential at its far end,
// ~5e-3 there).  It only starts scatX's Newton: the ray's periastron comes
// from the pixel's direction there, and the camera-azimuth quadrature and
// the U table row are both built from that one periastron (one ray).
float periastron(float b){
  float p = b;
  for (int k = 0; k < 24; ++k){
    float f = p * p * p - b * b * (p - 1.0);
    float fp = max(3.0 * p * p - b * b, 1e-3);
    p -= f / fp;
  }
  return p;
}

// The scattering ray through the pixel, from the camera at uR and the
// pixel's Fc = w_c^2 A cot^2 chi_st (static frame; python reference:
// disk_table.scat_x, design [P17], [P18]).  Returns X = w_p - w_c (the
// periastron w_p = 1/p measured from the camera, w_c = 1/uR), tw = 2 - 3 w_p
// and w_p, without cancellation.  At chi_st = 90 deg the camera is its own
// periastron and the camera azimuth goes like sqrt(X); X from b alone
// (b -> p -> (R - p)/(R p)) loses the pixel there, since b = R sin(chi)/
// sqrt(A) is stationary in chi (an f32 b holds chi to ~4e-4 rad) and the p
// Newton nears a double root as R -> 1.5 (up to 1e-1 in r at R = 1.51
// before 2026-10-13).  X is the root of h(w_c + X) - h(w_c) = Fc, h(w) =
// w^2 (1 - w): Newton from the periastron of b, whose X is right off 90 deg
// and whose clamp to 0 near 90 deg is within Newton's reach (the true X
// <~ 1e-5).  X stops at the periastron of the U table's first row (uDiskWp0,
// [P18]): a ray nearer b_cr is that row's ray (w_p, tw) = (uDiskWp0,
// uDiskTw0), so the quadrature and the row stay one ray; a camera inside
// that periastron (uR < 1.500076) sits at it (X = 0).
float scatX(float b, float Fc, out float wc, out float tw, out float wp){
  wc = 1.0 / uR;
  float two3 = 2.0 * uR - 3.0;
  float S0 = two3 * wc * wc, a2 = 1.0 - 3.0 * wc;
  float Xm = uDiskWp0 - wc;
  tw = uDiskTw0; wp = uDiskWp0;
  if (Xm <= 0.0) return 0.0;
  float X = clamp(1.0 / max(periastron(b), 1.5) - wc, 0.0, Xm);
  for (int k = 0; k < 4; ++k){
    float H = Fc - X * (S0 + X * (a2 - X));
    float hp = S0 + X * (2.0 * a2 - 3.0 * X);
    X = clamp(X + H / max(hp, 1e-12), 0.0, Xm);
  }
  if (X >= Xm) return Xm;
  tw = two3 / uR - 3.0 * X; wp = wc + X;
  return X;
}

// A camera beyond uDiskRmax runs the azimuth quadrature to uDiskRmax and adds
// the azimuth the orbit sweeps from there out to the camera: the sky's
// far-branch leg (python reference = disk_table.far_leg).  Every disk ray
// (b <= 21, periastron <= 20.5) passes uDiskRmax, so no camera radius is
// excluded.
float diskLeg(float b, float wp){
  if (uR <= uDiskRmax) return 0.0;
  float w = 1.0 / uR, wc = 1.0 / uDiskRmax;
  if (wp < 0.0 || wc <= 0.5 * wp) return phiW(1.0 / (b * b), w, wc);
  float tR = sqrt(max(wp - w, 0.0)), tc = sqrt(max(wp - wc, 0.0));
  return phiT(wp, tc, 0.5 * (wc - w) / (tR + tc));
}

// asinh, sign-symmetric: the naive log(x + sqrt(x x + 1)) cancels for large
// negative x (up to 0.9 rad near b_cr; disk_table.py selftest 8)
float asinhS(float x){
  float ax = abs(x);
  return sign(x) * log(ax + sqrt(ax * ax + 1.0));
}

// The three camera-azimuth quadratures (disk_table.py _q_lnw / _q_sinh /
// _q_scat): GL-12 on each of two equal halves of a variable in which the
// integrand is smooth.
// Plunging, between w = e^{y0} and the horizon w = 1 (signed: negative for
// y0 > 0, a camera inside the horizon), in y = ln w with b factored out:
// b e^y / sqrt(1 + b^2 e^{2y} (e^y - 1)).  Used for b < uDiskBq or R <= 1.
float quadLnW(float b, float y0){
  float H = -0.5 * y0, hh = 0.5 * H, bb = b * b, tot = 0.0;
  for (int j = 0; j < 2; ++j){
    float c = y0 + H * (float(j) + 0.5), s = 0.0;
    for (int k = 0; k < 6; ++k){
      float ea = exp(c - hh * GLX[k]), eb = exp(c + hh * GLX[k]);
      s += GLW[k] * (ea * inversesqrt(1.0 + bb * ea * ea * (ea - 1.0))
                   + eb * inversesqrt(1.0 + bb * eb * eb * (eb - 1.0)));
    }
    tot += hh * s;
  }
  return b * tot;
}
// Plunging, b >= uDiskBq, camera outside the horizon: the exact identity
// 1/b^2 - w^2 (1 - w) = delta + (w - 2/3)^2 (w + 1/3), delta from
// eps = b_cr - b without cancellation, and w - 2/3 = sqrt(delta) sinh s.
float sinhTerm(float s, float sg){
  float e = exp(s), ei = 1.0 / e;
  float sh = 0.5 * (e - ei), ch = 0.5 * (e + ei);
  float w = 2.0 / 3.0 + sg * sh;
  return ch * inversesqrt(1.0 + sh * sh * (w + 1.0 / 3.0));
}
float quadSinh(float b, float eps, float xlo, float xhi){
  float sg = sqrt(eps * (uBcr + b) / (b * b * uBcr * uBcr));
  float s0 = asinhS(xlo / sg), s1 = asinhS(xhi / sg);
  float H = 0.5 * (s1 - s0), hh = 0.5 * H, tot = 0.0;
  for (int j = 0; j < 2; ++j){
    float c = s0 + H * (float(j) + 0.5), s = 0.0;
    for (int k = 0; k < 6; ++k)
      s += GLW[k] * (sinhTerm(c - hh * GLX[k], sg) + sinhTerm(c + hh * GLX[k], sg));
    tot += hh * s;
  }
  return tot;
}
// Scattering, from the periastron w_p out to the radius 1/(w_p - xt):
// 1/b^2 - w^2 + w^3 = (w_p - w)(u_2 - w)(w - u_3), w_p - w = eps sinh^2 s,
// -> 2 ds / sqrt(w - u_3); eps = u_2 - w_p and u_3 from w_p and tw = 2 - 3 w_p
// alone.  xt comes in as such (scatX), never as a difference near 0.
float quadScatW(float wp, float tw, float xt){
  float rt = sqrt((1.0 - wp) * (1.0 + 3.0 * wp));
  float eps = max(2.0 * wp * tw / (rt + 3.0 * wp - 1.0), 1e-30);
  float u3 = -2.0 * wp * (1.0 - wp) / ((1.0 - wp) + rt);
  float sR = asinhS(sqrt(min(max(xt, 0.0) / eps, 1e30)));
  float H = 0.5 * sR, hh = 0.5 * H, tot = 0.0;
  for (int j = 0; j < 2; ++j){
    float c = H * (float(j) + 0.5), s = 0.0;
    for (int k = 0; k < 6; ++k){
      float ea = exp(c - hh * GLX[k]), eb = exp(c + hh * GLX[k]);
      float sa = 0.5 * (ea - 1.0 / ea), sb = 0.5 * (eb - 1.0 / eb);
      s += GLW[k] * (2.0 * inversesqrt(wp - eps * sa * sa - u3)
                   + 2.0 * inversesqrt(wp - eps * sb * sb - u3));
    }
    tot += hh * s;
  }
  return tot;
}
// U_SCAT row of the ray whose periastron is p (q = p - 3/2 from scatX's tw,
// no subtraction): y = ln(b' - b_cr), b'^2 = p^3/(p - 1),
// b' - b_cr = (p - 3/2)^2 (p + 3) / ((p - 1)(b' + b_cr))
float scatRow(float p, float q){
  float d2 = q * q * (p + 3.0) / (p - 1.0);
  return log(max(d2 / (sqrt(uBcr * uBcr + d2) + uBcr), 1e-30));
}

// Crossing geometry for an arbitrary disk normal uZd.  Radial axis = the
// camera's true world radial direction -aHat, never the world z axis: free
// flight moves the camera off the initial z ray while the disk plane stays
// world-fixed.  f64 reference and rotated-frame proof: disk.py
// crossing_geometry_general (r_hat = -aHat, e2 = p).
void diskGeom(vec3 aHat, vec3 p, out float phi1, out float mz){
  float e2z = dot(p, uZd);
  mz = dot(cross(-aHat, p), uZd);
  phi1 = mod(atan(dot(aHat, uZd), e2z), PI);
  if (phi1 < 1e-6) phi1 = PI;
}

// The whole disk path for one pixel, from its invariants: b, whether the
// traced ray moves to larger r (outgoing), the static-frame |cot chi_st|
// (outside the horizon; < 0 = no static frame, the interior engine), the
// crossing geometry (phi_1, m_z) and gInf, the camera's frequency over the
// photon's conserved energy (a source at rest at infinity).  Out: r, g, k of
// the first crossing in [uRin, uRout] (opaque disk).  Python mirror:
// disk_table.disk_hit (pixel_ray / disk_ray; cot = disk_table.shader_cot).
bool diskHitAt(float b, bool outgoing, float cotSt, float phi1, float mz,
               float gInf, out float rHit, out float gHit, out float kHit){
  rHit = 0.0; gHit = 0.0; kHit = -1.0;
  if (b > uDBmax) return false;        // periastron beyond any disk edge
  float Rt = min(uR, uDiskRmax);       // the quadrature runs to here; diskLeg beyond
  // The branch, and a plunging ray's eps, from delta = 1/b^2 - 4/27 of the
  // pixel's ray = Fc - D^2 (w_c + 1/3) (the [P14] identity; Fc = 1/b^2 -
  // h(w_c) = w_c^2 A cot^2, D = 2/3 - w_c): cot keeps the pixel where the
  // critical curve nears chi_st = 90 deg (R -> 1.5), where an f32 b resolves
  // b - b_cr only to its ulp 2.4e-7 and sent rays to the wrong branch
  // (design [P18]: disk drawn where no ray of the pixel meets it, holes).
  // The interior engine has no static frame and only b < b_cr rays.
  bool useCot = cotSt >= 0.0;
  float Fc = 0.0, dlt = 0.0;
  if (useCot) {
    float wc0 = 1.0 / uR;
    float D = (2.0 * uR - 3.0) / (3.0 * uR);
    Fc = wc0 * wc0 * ((uR - 1.0) / uR) * cotSt * cotSt;
    dlt = Fc - D * D * (wc0 + 1.0 / 3.0);
  }
  bool scat = useCot ? (dlt < 0.0) : (b > uBcr);
  float angCam, at, rowf;
  if (scat) {
    // inside the photon sphere a b > b_cr ray turns at the inner root r_2(b)
    // < 1.5 of u^2 (1 - u) = 1/b^2 and never reaches r_in (disk.py selftest 11)
    if (uR <= 1.5) return false;
    // the periastron from the pixel's direction (scatX): every scattering
    // quantity below is built from this w_p, so they describe one ray
    float wc, tw, wp;
    float X = scatX(b, Fc, wc, tw, wp);
    float pr = 1.0 / wp;
    float xt = (uR <= uDiskRmax) ? X : wp - 1.0 / Rt;   // w_p - 1/Rt
    rowf = (scatRow(pr, 0.5 * tw / wp) - uDY0) / (uDY1 - uDY0) * (uDNY - 1.0);
    at = auxFetch(rowf).y;
    if (Rt >= uDiskAtabR)
      angCam = fetchBilin(uAS, rowf, sqrt(max(Rt * pr * xt, 0.0)) / uDVmax * (uDNV - 1.0),
                          uDNY, uDNV);
    else angCam = quadScatW(wp, tw, xt);
    angCam += diskLeg(b, wp);
  } else {
    // eps = b_cr - b of the ray integrated, floored at the tables' first row
    // so that the quadrature and the row are one ray ([P18]; from b: its
    // f32 resolution 1e-7)
    float eps = (useCot && b >= uDiskBq)
      ? max(dlt * b * b * uBcr * uBcr / (uBcr + b), uDiskEps0)
      : max(uBcr - b, 1e-7);
    rowf = (log(eps) - uDZ0) / (uDZ1 - uDZ0) * (uDNY - 1.0);
    at = (b < uDiskBq) ? quadLnW(b, uDiskYarc) : auxFetch(rowf).z;
    // the signed azimuth from the horizon to the camera (negative inside
    // it).  Outside the photon sphere (b >= uDiskBq) it is at minus the
    // azimuth from the arc's far end in to the camera: near b_cr the row's
    // arc (an ODE integral through the winding at r = 1.5) runs long by up to
    // 8e-4 rad, which a camera outside the winding must not see ([P18])
    if (Rt >= uDiskAtabR) {
      float w = log(max(Rt - 1.0, 0.4));
      angCam = fetchBilin(uAC, rowf, (w - uDW0) / (uDW1 - uDW0) * (uDNV - 1.0),
                          uDNY, uDNV);
    } else if (Rt <= 1.0 || b < uDiskBq) angCam = quadLnW(b, -log(Rt));
    else if (Rt <= 1.5)
      angCam = quadSinh(b, eps, (3.0 - 2.0 * Rt) / (3.0 * Rt), 1.0 / 3.0);
    else angCam = at - quadSinh(b, eps, uDiskXarc, (3.0 - 2.0 * Rt) / (3.0 * Rt));
    angCam += diskLeg(b, -1.0);
  }
  if (!(at > 0.0)) return false;       // b = 0: the radial ray sweeps nothing
  // three crossings outside the horizon at most: an outgoing plunging ray from
  // inside it skips k = 0 when that crossing is still inside (|calA| < pi)
  int k0 = (!scat && outgoing && angCam + phi1 < 0.0) ? 1 : 0;
  for (int j = 0; j < 3; ++j){
    float fk = phi1 + float(k0 + j) * PI;
    float ang = scat ? (outgoing ? angCam + fk : abs(angCam - fk))
                     : (outgoing ? angCam + fk : angCam - fk);
    if (ang < 0.0 || ang > at) continue;   // < 0: inside the horizon (plunging)
    float colf = ang / at * (uDNS - 1.0);
    float u = scat ? fetchBilin(uUS, rowf, colf, uDNY, uDNS)
                   : fetchBilin(uUC, rowf, colf, uDNY, uDNS);
    if (u <= 1e-6) continue;
    float r = 1.0 / u;
    if (r >= uRin && r <= uRout) {
      // g = g_E g_inf: the Keplerian emitter's factor (+ sign: the traced
      // ray's spatial momentum is the real photon's, flipped) times the
      // camera's own (disk.py g_emitter / pixel_invariants)
      float gE = sqrt(max(1.0 - 1.5 / r, 0.0))
               / (1.0 + sqrt(0.5 / (r * r * r)) * b * mz);
      rHit = r; gHit = gE * gInf; kHit = float(k0 + j);
      return true;
    }
  }
  return false;
}

// Shakura-Sunyaev shape, T = uTmax at the profile peak x = 49/36
float diskT(float r){
  float x = r / uRin;
  float f4 = max((1.0 - inversesqrt(x)) / (x * x * x), 0.0) / 0.0566524;
  return uTmax * pow(f4, 0.25);
}
// blackbody at T_obs = g T(r); brightness (T_obs/T_max)^4 carries the whole
// g^4 beaming (no separate factor: that would double it).  The disk always
// carries its Doppler shift (its left/right asymmetry is the point); uDop only
// switches the sky's shift, whose toggle is hidden for now (user 2026-10-06).
vec3 diskColor(float r, float g){
  float Tobs = clamp(g * diskT(r), 300.0, 4.0e4);
  float inten = uExpo * pow(Tobs / uTmax, 4.0);
  return vec3(bbR(Tobs), bbG(Tobs), bbB(Tobs)) / 255.0 * (inten / (1.0 + inten));
}

vec3 skyGrid(vec3 s){
  // The graticule labels positions on one fixed celestial sphere.  Using
  // aHat for latitude while using world x/y for longitude mixed two frames:
  // it happened to agree on the initial z axis but became contradictory once
  // the camera translated.  Both angles now use the same fixed world frame.
  float th = acos(clamp(dot(s, SKY_NORTH), -1.0, 1.0));
  float ph = atan(s.y, s.x);
  float td = degrees(th);
  float pd = degrees(mod(ph, 2.0 * PI));
  float checker = mod(floor(td / 15.0) + floor(pd / 15.0), 2.0);
  vec3 c = (checker > 0.5) ? vec3(0.16, 0.22, 0.42) : vec3(0.10, 0.13, 0.28);
  float warm = 0.5 * (1.0 - cos(th));
  c += vec3(0.25, 0.10, -0.05) * warm;
  float lt = min(mod(td, 15.0), 15.0 - mod(td, 15.0));
  float lp = min(mod(pd, 15.0), 15.0 - mod(pd, 15.0));
  if (lt < 0.25 || lp < 0.25) c = vec3(0.55, 0.60, 0.70);
  return c;
}

// Photo sky: an equirectangular all-sky image in galactic coordinates
// (l = 0 at the image centre, l growing to the left, b = +90 deg at the top;
// source and license: export_sky.py / sky_milkyway.txt).  The galactic frame
// is pinned to the world frame so that the initial view (camera on +z looking
// at the hole along -z, screen up +y, screen right +x) has the hole in the
// direction of galactic rotation, 30 deg above the plane: -z = (l, b) =
// (90 deg, +30 deg), galactic north as far up as that allows (+y = cos30 N
// - sin30 L90), which puts the Galactic Centre exactly on screen right (+x)
// and the Milky Way band 30 deg below the hole.  The frame is right-handed,
// GAL_C x GAL_L90 = GAL_N (l grows to the left as seen from inside the
// sphere).  User choice 2026-10-13 (DESIGN.md "初期視点の銀河の向き"); until
// then the Centre sat straight behind the hole with north up.
const vec3 GAL_C = vec3(1.0, 0.0, 0.0);                 // (l, b) = (0, 0)
const vec3 GAL_L90 = vec3(0.0, -0.5, -0.8660254038);    // (90 deg, 0)
const vec3 GAL_N = vec3(0.0, 0.8660254038, -0.5);       // b = +90 deg
vec3 skyImage(vec3 s){
  float l = atan(dot(s, GAL_L90), dot(s, GAL_C));
  float b = asin(clamp(dot(s, GAL_N), -1.0, 1.0));
  vec2 uv = vec2(0.5 - l / (2.0 * PI), 0.5 - b / PI);
  // Explicit mip level from this pixel's angular footprint on the sky.  The
  // derivatives of the unit vector s are continuous across the l = 180 deg
  // seam, unlike those of uv.x; near the photon ring the footprint grows
  // without bound and the lookup tends to the mean sky, as it should.
  float foot = max(length(dFdx(s)), length(dFdy(s)));
  float lod = log2(max(foot * uSkyW / (2.0 * PI), 1e-6));
  lod = isnan(lod) ? 0.0 : clamp(lod, 0.0, 13.0);
  return textureLod(uSkyImg, uv, lod).rgb;
}

void main(){
  vec3 dir = normalize(uFwd + vNdc.x * uTanHalf * uAspect * uRight
                            + vNdc.y * uTanHalf * uUp);
  vec3 aHat = uBhat;                            // toward the BH (world frame)
  float cCam = clamp(dot(dir, aHat), -1.0, 1.0);
  vec3 p = dir - aHat * cCam;
  float pl = length(p);
  p = (pl > 1e-6) ? p / pl : vec3(1.0, 0.0, 0.0);

  float psi = 0.0; float g = 1.0; int fate = 1;
  bool diskHit = false; float dR = 0.0, dG = 0.0, dK = -1.0;
  // Engine choice.  The interior lookup knows only the falling (FFO) frame,
  // so it is used inside the horizon (no static observer exists there) and
  // for a falling camera below the psi table's lower end uEngineR.  A static
  // camera outside the horizon always uses the exterior engine (below
  // uEngineR its psi row is the table's last one).  Measured against f64 at
  // R = 1.02-1.09, facing the hole: exterior median 2e-6 rad, interior
  // 2e-4 with up to ~1 rad at the shadow edge (DESIGN.md "R = 1.1 の
  // engine 切替").
  bool interior = uR <= 1.0 || (uFFO && uR < uEngineR) || uFlyIn;
  if (interior) {
    // interior/near-horizon engine: the table is in the radial free-fall
    // frame (E = 1, L = 0).  A powered pilot below R_SWITCH (uFlyIn) carries
    // its velocity uBeta relative to that frame (interior_flight.py): its
    // pixel is de-aberrated into the free-fall frame first, with the same
    // map the exterior branch applies against the static frame, and the
    // table's g is multiplied by the boost factor.
    float gBoost = 1.0;
    if (uFlyIn) {
      float b2 = dot(uBeta, uBeta);
      if (b2 > 1e-12) {
        float gam = inversesqrt(max(1.0 - b2, 1e-7));
        float bd = dot(uBeta, dir);
        vec3 dirL = normalize((dir + (((gam - 1.0) * bd / b2 - gam) * uBeta))
                              / (gam * (1.0 - bd)));
        gBoost = 1.0 / (gam * (1.0 - bd));
        cCam = clamp(dot(dirL, aHat), -1.0, 1.0);
        p = dirL - aHat * cCam; pl = length(p);
        p = (pl > 1e-6) ? p / pl : vec3(1.0, 0.0, 0.0);
      }
    }
    float chi = acos(cCam);
    vec3 v = intLookup(uR, chi);
    psi = v.x; g = v.y * gBoost; fate = int(v.z + 0.5);
    // DEFAULT = collapse-formed hole: the far universe / white-hole light
    // do not exist — the star's image has redshifted away (BH_shooter
    // Sec. 4). The eternal view keeps regions III/IV.
    if (!uEternal && fate == 3) fate = 0;
    // ---- accretion disk seen from the free-fall frame (here R < 1.02): only
    // the pixels that reach our exterior can see it, b < b_cr and
    // cos(chi_F) < min(sqrt R, 1/sqrt R) (disk.py pixel_invariants), and their
    // traced rays move outward.  b = R sin(chi_F)/E_u with E_u = 1 -
    // cos(chi_F)/sqrt(R) the conserved energy of the unit-frequency photon;
    // g_inf = gBoost/E_u.  phi_1 and m_z come from the transverse direction p
    // exactly as outside (a radial boost leaves it alone).  The table's fate
    // is quantized on a 0.25 deg grid; this test is exact, so a hit wins even
    // on a node the table calls dark.
    if ((uDisk || uDiskProbe > 0) && !uProbe && uR > uDiskRmin) {
      float sqR = sqrt(uR);
      float Eu = (sqR - cCam) / sqR;
      float bI = (Eu > 0.0) ? uR * pl / Eu : 1e30;
      if (cCam < min(sqR, 1.0 / sqR) && bI < uBcr) {
        float phi1, mz;
        diskGeom(aHat, p, phi1, mz);
        // b < b_cr here (no scattering ray) and no static frame: cot < 0
        diskHit = diskHitAt(bI, true, -1.0, phi1, mz, gBoost / Eu, dR, dG, dK);
      }
    }
  } else {
    // General local-static inverse aberration.  dir points from the camera
    // to the source, so the arriving photon momentum is -dir.  For the old
    // radial FFO beta = sqrt(1/R) aHat this reduces exactly to ffo.py's
    // cos(chi_st) = (cos(chi_cam)-beta)/(1-beta cos(chi_cam)).
    float b2 = dot(uBeta, uBeta);
    float gam = inversesqrt(max(1.0 - b2, 1e-7));
    float bd = dot(uBeta, dir);
    vec3 dirSt = (b2 > 1e-12)
      ? (dir + (((gam - 1.0) * bd / b2 - gam) * uBeta)) / (gam * (1.0 - bd))
      : dir;
    dirSt = normalize(dirSt);
    float cSt = clamp(dot(dirSt, aHat), -1.0, 1.0);
    p = dirSt - aHat * cSt;                    // transverse direction is not
    pl = length(p);                             // boost-invariant in general
    float sSt = pl;                             // sin(chi_st), full precision
    p = (pl > 1e-6) ? p / pl : vec3(1.0, 0.0, 0.0);
    // ---- accretion disk first: crossings can sit in front of the shadow.
    // b, phi_1, m_z all come from the STATIC-frame angle / the transverse
    // direction p, both invariant under the radial FFO boost.  Every camera
    // radius outside the horizon (inside the photon sphere only the outgoing
    // plunging rays reach the disk; diskHitAt sorts that out); beyond
    // uDiskRmax diskHitAt adds the far leg.  b uses sSt, not sqrt(1 - c^2):
    // from far away the disk sits within chi ~ 21/R of the hole, where
    // 1 - c^2 loses its digits in f32.
    if ((uDisk || uDiskProbe > 0) && !uProbe && uR > uDiskRmin) {
      float A = 1.0 - 1.0 / uR;
      float phi1, mz;
      diskGeom(aHat, p, phi1, mz);
      // g_inf = the static camera's 1/sqrt(A), then the arbitrary camera
      // boost (the radial FFO expression in its general vector form)
      // |cot chi_st| keeps the pixel at 90 deg, where b does not (the
      // branch, a plunging eps and the scattering periastron come from it)
      diskHit = diskHitAt(uR * sSt / sqrt(A), cSt <= 0.0,
                          abs(cSt) / max(sSt, 1e-30), phi1, mz,
                          1.0 / (sqrt(A) * gam * (1.0 - bd)), dR, dG, dK);
    }
    if (uR > uRref) {
      // beyond the table: shadow iff ingoing with b <= b_cr (= chi <= edge)
      float bF = uR * sSt * inversesqrt(1.0 - 1.0 / uR);
      if (cSt > 0.0 && bF <= uBcr) fate = 0;
      else psi = psiFar(uR, cSt, sSt);
    } else {
      float chiSt = acos(cSt);
      float edge = edgeOf(uR);
      if (chiSt <= edge) fate = 0;
      else {
        float t = sqrt((chiSt - edge) / (PI - edge));
        psi = psiLookup(uR, t);
      }
    }
    if (fate != 0) g = 1.0 / (sqrt(1.0 - 1.0 / uR) * gam * (1.0 - bd));
  }
  if (uProbe) { frag = encodePsi(psi, fate == 0); return; }
  // disk probe: r, g or k + 1 of the hit in the psi encoding, 0 = no hit
  if (uDiskProbe > 0) {
    float pv = (uDiskProbe == 1) ? dR : (uDiskProbe == 2) ? dG : dK + 1.0;
    frag = encodePsi(pv, !diskHit); return;
  }

  // The sky is looked up for every pixel before the disk / shadow selection
  // below: the photo sky takes screen-space derivatives, which GLSL ES 3.00
  // leaves undefined after a divergent return.  Shadow pixels carry psi = 0;
  // that only enlarges the footprint (a blurrier texel) of their neighbours
  // right at the shadow edge.
  float psiS = (fate == 0 || isnan(psi)) ? 0.0 : psi;
  vec3 sky = -cos(psiS) * aHat + sin(psiS) * p;
  vec3 col = uSkyImage ? skyImage(sky) : skyGrid(sky);
  // far universe: warm counterpart (R/B swap) of render_interior.sky_color_III
  // (the offline renderers' orange marker retint has no web counterpart)
  if (fate == 3) col = col.bgr;
  if (diskHit) { frag = vec4(diskColor(dR, dG), 1.0); return; }
  if (fate == 0) { frag = vec4(0.0, 0.0, 0.0, 1.0); return; }
  if (uDop && (uFFO || uFlying || interior)) {
    col = dopplerShift(col, g);       // chroma (Nakayama-Oda Sec. 5.4)
    col *= pow(g, 4.0);               // bolometric beaming
    col = col / (1.0 + col);          // Reinhard
  }
  frag = vec4(col, 1.0);
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}

async function main(){
  // meta.json is always revalidated; the tables are keyed by its payload_id
  // (content hash, export_table.py), so a cached old table can never be read
  // with new grid sizes (Pages lets browsers cache files for 10 minutes).
  const meta = await (await fetch("meta.json", { cache: "no-cache" })).json();
  const q = meta.payload_id ? "?v=" + meta.payload_id : "";
  const bin = name => fetch(name + ".bin" + q).then(r => r.arrayBuffer());
  const [buf, ibuf, rbuf, dus, das, duc, dac, daux] = await Promise.all([
    bin("psi_table"), bin("interior_table"), bin("interior_rgrid"),
    bin("disk_u_scat"), bin("disk_a_scat"), bin("disk_u_cap"),
    bin("disk_a_cap"), bin("disk_aux"),
  ]);
  const need = (b, floats, name) => {
    if (b.byteLength !== 4 * floats)
      throw new Error(t("binSize", name, b.byteLength, 4 * floats));
  };
  need(buf, meta.nR * meta.nt, "psi_table");
  need(ibuf, meta.int_nR * meta.int_nchi * 4, "interior_table");
  need(rbuf, meta.int_nR, "interior_rgrid");
  // the disk's camera-azimuth quadrature and the critical-band floors need
  // these (export_table.py, 2026-10-13)
  if (meta.disk_b_quad === undefined || meta.disk_y_arc === undefined
      || meta.disk_scat_q0 === undefined || meta.disk_row_floor === undefined
      || meta.disk_x_arc === undefined)
    throw new Error(t("metaOld"));
  const data = new Float32Array(buf);

  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER,
    new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  function makeTex(unit, ifmt, w, h, fmt, arr){
    const t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, gl.FLOAT, arr);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  makeTex(0, gl.R32F, meta.nt, meta.nR, gl.RED, data);
  makeTex(1, gl.RGBA32F, meta.int_nchi, meta.int_nR, gl.RGBA,
          new Float32Array(ibuf));
  makeTex(2, gl.R32F, meta.int_nR, 1, gl.RED, new Float32Array(rbuf));
  makeTex(3, gl.R32F, meta.disk_nsig, meta.disk_ny, gl.RED,
          new Float32Array(dus));
  makeTex(4, gl.R32F, meta.disk_nv, meta.disk_ny, gl.RED,
          new Float32Array(das));
  makeTex(5, gl.R32F, meta.disk_nsig, meta.disk_ny, gl.RED,
          new Float32Array(duc));
  makeTex(6, gl.R32F, meta.disk_nv, meta.disk_ny, gl.RED,
          new Float32Array(dac));
  makeTex(7, gl.RGBA32F, meta.disk_ny, 1, gl.RGBA, new Float32Array(daux));
  gl.activeTexture(gl.TEXTURE0);

  const U = n => gl.getUniformLocation(prog, n);
  gl.uniform1i(U("uTab"), 0);
  gl.uniform1i(U("uIntTab"), 1);
  gl.uniform1i(U("uIntR"), 2);
  gl.uniform1i(U("uUS"), 3);
  gl.uniform1i(U("uAS"), 4);
  gl.uniform1i(U("uUC"), 5);
  gl.uniform1i(U("uAC"), 6);
  gl.uniform1i(U("uAux"), 7);
  gl.uniform1f(U("uNR"), meta.nR);
  gl.uniform1f(U("uNT"), meta.nt);
  gl.uniform1f(U("uLogRmin"), Math.log(meta.R_min));
  gl.uniform1f(U("uLogRmax"), Math.log(meta.R_max));
  gl.uniform1f(U("uT0"), meta.t0);
  gl.uniform1f(U("uBcr"), meta.b_cr);
  gl.uniform1f(U("uIntNR"), meta.int_nR);
  gl.uniform1f(U("uIntNChi"), meta.int_nchi);
  gl.uniform1f(U("uDNY"), meta.disk_ny);
  gl.uniform1f(U("uDNS"), meta.disk_nsig);
  gl.uniform1f(U("uDNV"), meta.disk_nv);
  gl.uniform1f(U("uDY0"), meta.disk_y0);
  gl.uniform1f(U("uDY1"), meta.disk_y1);
  gl.uniform1f(U("uDZ0"), meta.disk_z0);
  gl.uniform1f(U("uDZ1"), meta.disk_z1);
  gl.uniform1f(U("uDVmax"), meta.disk_vmax);
  gl.uniform1f(U("uDW0"), meta.disk_w0);
  gl.uniform1f(U("uDW1"), meta.disk_w1);
  gl.uniform1f(U("uDBmax"), meta.disk_b_max);
  gl.uniform1f(U("uRin"), 3.0);      // ISCO (canonical defaults: DESIGN.md)
  gl.uniform1f(U("uRout"), 12.0);
  gl.uniform1f(U("uTmax"), 7000.0);
  gl.uniform1f(U("uExpo"), 3.0);
  gl.uniform1f(U("uDiskRmax"), meta.disk_R_cam_max);
  gl.uniform1f(U("uDiskBq"), meta.disk_b_quad);
  gl.uniform1f(U("uDiskYarc"), meta.disk_y_arc);
  gl.uniform1f(U("uDiskXarc"), meta.disk_x_arc);
  // the U tables' first row: plunging eps and scattering periastron floor
  // (disk_table.ROW_FLOOR / SCAT_Q0 / scat_floor_ray, design [P18])
  gl.uniform1f(U("uDiskEps0"), meta.disk_row_floor);
  gl.uniform1f(U("uDiskWp0"), 1 / (1.5 + meta.disk_scat_q0));
  gl.uniform1f(U("uDiskTw0"), 2 * meta.disk_scat_q0 / (1.5 + meta.disk_scat_q0));
  gl.uniform1i(U("uDiskProbe"), 0);
  gl.uniform1f(U("uRref"), meta.R_max);
  gl.uniform1f(U("uBsplit"), meta.far_b_split);
  gl.uniform1f(U("uEngineR"), meta.R_min);

  // ---- photo sky (the default sky): fetched at start-up, or the first time
  // it is selected (2.9 MB), mipmapped.  Until it is ready the grid stays on.  Unit 8 holds a 1x1 black texel so
  // the sampler is always complete.
  const skyTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE8);
  gl.bindTexture(gl.TEXTURE_2D, skyTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
                new Uint8Array([0, 0, 0, 255]));
  gl.activeTexture(gl.TEXTURE0);
  gl.uniform1i(U("uSkyImg"), 8);
  let skyState = "none";           // none | loading | ready | failed
  let skyLoaded = null;            // resolves when the image is on the GPU
  function loadSky(){
    if (skyLoaded) return skyLoaded;
    skyState = "loading";
    skyLoaded = new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        // Devices whose texture limit is below the image width get a
        // downscaled copy (WebGL2 only guarantees 2048).
        const max = gl.getParameter(gl.MAX_TEXTURE_SIZE);
        let src = img;
        if (img.naturalWidth > max) {
          src = document.createElement("canvas");
          src.width = max; src.height = max / 2;
          src.getContext("2d").drawImage(img, 0, 0, max, max / 2);
        }
        gl.activeTexture(gl.TEXTURE8);
        gl.bindTexture(gl.TEXTURE_2D, skyTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, src);
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.activeTexture(gl.TEXTURE0);
        gl.uniform1f(U("uSkyW"), src.width);
        skyState = "ready"; updateSky(); resolve(true);
      };
      img.onerror = () => { skyState = "failed"; updateSky(); resolve(false); };
      img.src = "sky_milkyway.jpg";
    });
    updateSky();
    return skyLoaded;
  }
  function updateSky(){
    const want = el("sky").value === "milkyway";
    if (want && skyState === "none") loadSky();
    el("skycredit").hidden = !want;
    el("skynote").textContent = !want ? ""
      : skyState === "loading" ? t("skyLoading")
      : skyState === "failed" ? t("skyFailed") : "";
  }

  // ---- camera state (the R range crosses the horizon down to Rmin below)
  let yaw = 0, pitch = 0, fov = 100;
  // This is a camera-attached triad, not a coordinate triad centred on the
  // black hole.  Every look input rotates these three axes in place.
  const view = { fwd: [0, 0, -1], right: [1, 0, 0], up: [0, 1, 0] };
  // mass presets: r_S/c in seconds (params.py is the reference)
  const RS_SEC = { sun: 9.851e-6, SgrA: 9.851e-6 * 4.30e6, M87: 9.851e-6 * 6.5e9 };
  // Proper-time rate: wall-clock seconds advance the camera's proper time at
  // the real rate of the selected mass (1 r_S/c = RS_SEC[mass] seconds) times
  // the multiplier of the speed slider, 1e-4 .. 1e4 (log), default x1 = real
  // time everywhere, inside and outside the horizon (user 2026-10-13「固有時間
  // の倍率は常時１でよいのでは？」; Sgr A* then gives 28 s from the horizon in
  // radial free fall and up to 66 s at E = 0).  Nothing but the slider
  // changes the multiplier.
  const MULT_DECADES = 4;
  const multOf = () => Math.pow(10, MULT_DECADES * (2 * parseFloat(el("spd").value) - 1));
  const rateOf = () => multOf() / RS_SEC[el("mass").value];      // r_S/c per wall second
  function fmtRate(){
    const m = multOf(), sec = RS_SEC[el("mass").value];
    const mass = el("mass").options[el("mass").selectedIndex].text;
    const f = x => Number(x.toPrecision(2)).toString();
    const unit = sec >= 1 ? `1 rS/c = ${f(sec)} s` : `1 rS/c = ${f(sec * 1e6)} µs`;
    return Math.abs(m - 1) < 0.02 ? t("rate1", mass, unit)
      : m > 1 ? t("rateUp", f(m), mass)
      : t("rateDown", f(m), mass, f(1 / m));
  }
  const fmtSec = s => {
    const a = Math.abs(s);
    if (a < 1e-3) return (s * 1e6).toPrecision(3) + " \u00b5s";
    if (a < 1) return (s * 1e3).toPrecision(3) + " ms";
    if (a < 120) return s.toPrecision(3) + " s";
    if (a < 7200) return (s / 60).toPrecision(3) + " " + t("min");
    if (a < 172800) return (s / 3600).toPrecision(3) + " " + t("hour");
    return (s / 86400).toPrecision(3) + " " + t("day");
  };
  // R slider: log scale from deep inside the horizon (0.001, the interior
  // table's last row) out to 100 r_S.  It
  // only picks a start radius; beyond the psi table (R_max = 30) the shader's
  // far branch takes over, so any radius on it is exact.
  const Rmin = 0.001, Rmax = 100, R_DEFAULT = 50;   // user choice 2026-10-06
  const sliderToR = s => Rmin * Math.pow(Rmax / Rmin, s);
  const RToSlider = R => Math.log(R / Rmin) / Math.log(Rmax / Rmin);
  const el = id => document.getElementById(id);
  const add = (a, b) => a.map((x, i) => x + b[i]);
  const sub = (a, b) => a.map((x, i) => x - b[i]);
  const scale = (s, a) => a.map(x => s * x);
  const dot3 = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1],
                            a[2] * b[0] - a[0] * b[2],
                            a[0] * b[1] - a[1] * b[0]];
  const norm = a => Math.hypot(...a);
  const unit = a => scale(1 / Math.max(norm(a), 1e-14), a);
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  // Free flight has no inner limit (2026-10-13).  Below R_SWITCH (the psi
  // table's last row, meta.R_min = 1.02) the pilot is described by its
  // velocity relative to the radial free-fall observer (E = 1, L = 0), the
  // frame of the interior table, instead of the local static observer, which
  // does not exist at or inside the horizon; the view basis is rotated once
  // at the switch so the physical camera frame is continuous (f64 reference
  // and formulas: renderer/interior_flight.py).  The flight ends at the
  // interior table's last row Rmin, where the fall ends too.  Until
  // 2026-10-13 the limit was the photon sphere (1.52, DESIGN.md "scope 境界
  // (v1)"); the exterior engine never needed it, only the disk did, and the
  // disk is now drawn from every radius too.  R_max (30) is where the psi
  // table ends; beyond it the
  // shader's far branch (psi_far.py) continues the exact map, so the
  // exterior has no upper bound.  The R slider stays finite (up to 100): it
  // is the UI for picking a start radius, never a clamp.
  const R_SWITCH = 1.02;
  const FLIGHT_STEP = 0.02, FLIGHT_FRAME_BUDGET = 0.04;
  // Pilot thrust and speed damping (proper acceleration in c^2/r_S, damping
  // per r_S/c of proper time): the top speed is u = THRUST/DAMPING (= 0.625,
  // beta 0.53), reached on a 1/DAMPING = 0.6 r_S/c time scale.
  const PILOT_THRUST = 1.0, FLIGHT_DAMPING = 1.6;
  const setSliderFromR = R => { el("R").value = clamp(RToSlider(R), 0, 1); };
  setSliderFromR(R_DEFAULT);

  // The camera event has a true world position during free flight.  At rest
  // the retained rHat lets a player stop anywhere on an orbit without the
  // old radius slider snapping the world back to its initial z-axis ray.
  // camera.R is the authoritative radius; the slider writes it only on the
  // user's input event (and the integrators write the slider back), so
  // R > R_max survives a pause.
  const camera = {
    R: R_DEFAULT, rHat: [0, 0, 1], hHat: [0, 1, 0],
    E: 0, L: 0, rd: 0, active: false, lastNow: performance.now(),
    timeDebt: 0, orbitLock: false, interior: false, message: "",

  });
  canvas.addEventListener("pointerup", () => dragging = false);
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    fov = Math.max(30, Math.min(150, fov + e.deltaY * 0.05));
    el("fov").value = fov;
  }, { passive: false });

  let frames = 0, fps = 0, t0 = performance.now(), lastLookNow = performance.now();
  let lastBeta = [0, 0, 0];               // the boost the last draw used
  let lookYawVelocity = 0, lookPitchVelocity = 0;
  const LOOK_RATE = 1.1, LOOK_TAP = 0.035;

  function nudgeLook(key, amount){
    const yawDelta = key === "arrowleft" ? amount
      : key === "arrowright" ? -amount : 0;
    const pitchDelta = key === "arrowup" ? amount
      : key === "arrowdown" ? -amount : 0;
    turnView(yawDelta, pitchDelta);
  }
  function resetLookMotion(){
    lookYawVelocity = 0; lookPitchVelocity = 0;
    lastLookNow = performance.now();
  }
  function clearControls(){
    keys.clear(); arrowPresses.clear(); resetLookMotion();
  }

  function keyboardLook(){
    const now = performance.now();
    // A short cap guards against a tab waking after a pause.  The velocity
    // ramp then keeps both the start and direction reversal visually smooth.
    const dt = Math.min(Math.max((now - lastLookNow) / 1000, 0), 1 / 30);
    lastLookNow = now;
    const targetYaw = LOOK_RATE * ((keys.has("arrowleft") ? 1 : 0) -
                                   (keys.has("arrowright") ? 1 : 0));
    const targetPitch = LOOK_RATE * ((keys.has("arrowup") ? 1 : 0) -
                                     (keys.has("arrowdown") ? 1 : 0));
    const blend = 1 - Math.exp(-24 * dt);
    lookYawVelocity += (targetYaw - lookYawVelocity) * blend;
    lookPitchVelocity += (targetPitch - lookPitchVelocity) * blend;
    if (targetYaw || targetPitch) {
      for (const key of ARROW_KEYS) {
        const press = arrowPresses.get(key);
        if (keys.has(key) && press) press.advanced = true;
      }
    }
    turnView(lookYawVelocity * dt, lookPitchVelocity * dt);
  }

  // machine-verification hook (used by the repo's browser-driven checks):
  // __bh.snap(opts) atomically applies a state, draws synchronously, scans
  // the center row, and restores — safe against concurrent live interaction.
  // The "ring check" built on it (camera states, f64 targets from
  // render_ffo.py's validated facts, tolerances) lives with the f64 renderer's
  // verification notes, not in this payload.
  window.__bh = {
    drawOnce(){ draw(true); },
    // skyReady(): resolves once the photo sky is on the GPU (loads it if
    // needed), so a check can select it and wait before snap/probe.
    skyReady(){ return loadSky(); },
    snap(o){
      const saved = this.state();
      this.set(o);
      draw(true); draw(true);
      const out = this.scan();
      this.set(saved);
      draw(true);
      return out;
    },
    // probe(o, n): pin state o, draw psi (not colour) through the same
    // shader path, read an n x n grid of pixels plus the centre row (GL
    // origin bottom-left), restore.  Returns the camera (R, aHat, beta, view
    // basis, tanHalf, canvas size) and [x, y, psi|null] per pixel, so the
    // f64 checker (check_probe.py) rebuilds each pixel-centre direction and
    // recomputes psi with the f64 reference (psi_far.py / psi_table.py).
    probe(o, n = 12){
      const saved = this.state();
      this.set(o);
      gl.disable(gl.DITHER);
      gl.uniform1i(U("uProbe"), 1);
      draw(true);
      const w = canvas.width, h = canvas.height;
      const pts = [];
      for (let i = 0; i < n; i++)
        for (let j = 0; j < n; j++)
          pts.push([Math.floor((i + .5) / n * w), Math.floor((j + .5) / n * h)]);
      for (let i = 0; i < 5 * n; i++)
        pts.push([Math.floor((i + .5) / (5 * n) * w), Math.floor(h / 2)]);
      const px = new Uint8Array(4);
      const s = pts.map(([x, y]) => {
        gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
        const v = (px[0] * 65536 + px[1] * 256 + px[2]) / 16777216;
        return [x, y, v === 0 ? null : +(16 * v - 1).toFixed(7)];
      });
      const b = viewBasis();
      const out = { w, h, R: camera.R, aHat: scale(-1, camera.rHat),
                    beta: [...lastBeta], fwd: b.fwd, right: b.right, up: b.up,
                    flying: camera.active,
                    frame: (camera.active && camera.interior) ? "lemaitre" : "static",
                    tanHalf: Math.tan(parseFloat(el("fov").value) * Math.PI / 360),
                    s };
      gl.uniform1i(U("uProbe"), 0);
      gl.enable(gl.DITHER);
      this.set(saved);
      draw(true);
      return out;
    },
    // probeDisk(o, n, mode, opts): the disk's probe channel.  Pins state o
    // (disk forced on), draws the first disk hit's r (mode 1), g (2) or k + 1
    // (3) through the real shader path in probe()'s 24-bit encoding (0 = no
    // hit), reads the frame once and samples: the n x n grid and the centre
    // row as probe() takes them, plus opts.rect = [x0, y0, x1, y1] (GL
    // pixels, origin bottom-left) every opts.stride pixels, and with
    // opts.hits every opts.stride-th pixel (default 8) that hits.
    // check_probe.py check_disk recomputes each pixel with disk.py
    // reference_hits (no table).  engine / frame / beta say which shader
    // branch drew it and in which reference frame beta is meant.
    probeDisk(o, n = 12, mode = 1, opts = {}){
      const saved = this.state();
      this.set({ ...o, disk: true });
      gl.disable(gl.DITHER);
      gl.uniform1i(U("uDiskProbe"), mode);
      draw(true);
      const w = canvas.width, h = canvas.height;
      const buf = new Uint8Array(w * h * 4);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      const val = (x, y) => {
        const i = 4 * (y * w + x);
        const v = (buf[i] * 65536 + buf[i + 1] * 256 + buf[i + 2]) / 16777216;
        return v === 0 ? null : +(16 * v - 1).toFixed(7);
      };
      const pts = [];
      for (let i = 0; i < n; i++)
        for (let j = 0; j < n; j++)
          pts.push([Math.floor((i + .5) / n * w), Math.floor((j + .5) / n * h)]);
      for (let i = 0; i < 5 * n; i++)
        pts.push([Math.floor((i + .5) / (5 * n) * w), Math.floor(h / 2)]);
      if (opts.rect) {
        const [x0, y0, x1, y1] = opts.rect.map(Math.round), st = opts.stride || 1;
        for (let y = Math.max(y0, 0); y <= Math.min(y1, h - 1); y += st)
          for (let x = Math.max(x0, 0); x <= Math.min(x1, w - 1); x += st)
            pts.push([x, y]);
      }
      if (opts.hits) {
        const st = opts.stride || 8;
        for (let y = 0; y < h; y += st)
          for (let x = 0; x < w; x += st)
            if (val(x, y) !== null) pts.push([x, y]);
      }
      const b = viewBasis();
      const flyIn = camera.active && camera.interior;
      const interior = camera.R <= 1.0 || flyIn
        || (!camera.active && el("ffo").checked && camera.R < meta.R_min);
      const inc = parseFloat(el("inc").value) * Math.PI / 180;
      const out = { kind: "disk", mode, w, h, R: camera.R,
                    aHat: scale(-1, camera.rHat),
                    engine: interior ? "interior" : "exterior",
                    frame: interior ? (flyIn ? "lemaitre" : "ffo") : "static",
                    beta: (interior && !flyIn) ? [0, 0, 0] : [...lastBeta],
                    beta_draw: [...lastBeta],
                    fwd: b.fwd, right: b.right, up: b.up, flying: camera.active,
                    tanHalf: Math.tan(parseFloat(el("fov").value) * Math.PI / 360),
                    zd: [0, Math.sin(inc), Math.cos(inc)], rin: 3.0, rout: 12.0,
                    eternal: el("eternal").checked,
                    diskAtabR: diskKnobs.diskAtabR, diskRmin: diskKnobs.diskRmin,
                    s: pts.map(([x, y]) => [x, y, val(x, y)]) };
      gl.uniform1i(U("uDiskProbe"), 0);
      gl.enable(gl.DITHER);
      this.set(saved);
      draw(true);
      return out;
    },
    set(o){
      if (o.diskAtabR !== undefined) diskKnobs.diskAtabR = o.diskAtabR;
      if (o.diskRmin !== undefined) diskKnobs.diskRmin = o.diskRmin;
      if (o.Rslider !== undefined) {
        el("R").value = o.Rslider;
        camera.R = sliderToR(parseFloat(el("R").value));
      }
      if (o.R !== undefined) { camera.R = o.R; setSliderFromR(o.R); }
      if (o.rHat !== undefined) camera.rHat = unit(o.rHat);
      if (o.ffo !== undefined) el("ffo").checked = o.ffo;
      if (o.dop !== undefined) el("dop").checked = o.dop;
      if (o.eternal !== undefined) el("eternal").checked = o.eternal;
      if (o.disk !== undefined) el("disk").checked = o.disk;
      if (o.sky !== undefined) { el("sky").value = o.sky; updateSky(); }
      if (o.inc !== undefined) el("inc").value = o.inc;
      if (o.mass !== undefined) el("mass").value = o.mass;
      if (o.fov !== undefined) el("fov").value = o.fov;
      if (o.viewFwd !== undefined && o.viewUp !== undefined) {
        setViewBasis(o.viewFwd, o.viewUp);
      } else if (o.yaw !== undefined || o.pitch !== undefined) {
        setLegacyLook(o.yaw ?? 0, o.pitch ?? 0);
      }
      if (o.yaw !== undefined) yaw = o.yaw;
      if (o.pitch !== undefined) pitch = o.pitch;
    },
    state(){ return { Rslider: el("R").value, R: camera.R, rHat: [...camera.rHat],
                      hHat: [...camera.hHat], E: camera.E, L: camera.L, rd: camera.rd,
                      active: camera.active, interior: camera.interior,
                      yaw, pitch,
                      fov: el("fov").value, ffo: el("ffo").checked,
                      dop: el("dop").checked, eternal: el("eternal").checked,
                      disk: el("disk").checked, inc: el("inc").value,
                      diskAtabR: diskKnobs.diskAtabR, diskRmin: diskKnobs.diskRmin,
                      mass: el("mass").value,
                      sky: el("sky").value,
                      viewFwd: [...view.fwd], viewUp: [...view.up] }; },
    // scan(): the right half of the centre row, read through the psi channel
    // (same encoding as probe), not through colour.  Returns the shadow edge
    // and the psi = pi / 3 pi Einstein rings as horizontal view angles.  psi
    // is measured from the direction straight away from the hole, so the
    // rings exist whatever the sky texture is (no marker needed).  Ring
    // crossings are interpolated in psi between pixel centres; the shadow
    // edge is the pixel boundary, so it carries +-0.5 px (px_deg).
    scan(){
      gl.disable(gl.DITHER);
      gl.uniform1i(U("uProbe"), 1);
      draw(true);
      const w = canvas.width, h = canvas.height;
      const row = new Uint8Array(w * 4);
      gl.readPixels(0, Math.floor(h / 2), w, 1, gl.RGBA, gl.UNSIGNED_BYTE, row);
      gl.uniform1i(U("uProbe"), 0);
      gl.enable(gl.DITHER);
      draw(true);
      const k = Math.tan(parseFloat(el("fov").value) * Math.PI / 360)
                * (w / h) / (w / 2);
      const deg = x => Math.atan((x - w / 2) * k) * 180 / Math.PI;  // x = screen coordinate
      const psiAt = i => {
        const v = (row[4*i] * 65536 + row[4*i+1] * 256 + row[4*i+2]) / 16777216;
        return v === 0 ? null : 16 * v - 1;
      };
      let edge = -1;
      for (let i = Math.floor(w / 2); i < w; i++)
        if (psiAt(i) !== null) { edge = i; break; }
      const ring = target => {
        if (edge < 0) return null;
        for (let i = edge + 1; i < w; i++) {
          const a = psiAt(i - 1), b = psiAt(i);
          if (a !== null && b !== null && a > target && b <= target)
            return deg(i - 0.5 + (a - target) / (a - b));
        }
        return null;
      };
      return { shadow_deg: edge < 0 ? null : deg(edge),
               ring_pi_deg: ring(Math.PI),
               ring_3pi_deg: ring(3 * Math.PI),
               px_deg: edge < 0 ? null : deg(edge + 1) - deg(edge) };
    },
  };

  function draw(once){
    const w = canvas.clientWidth * devicePixelRatio;
    const h = canvas.clientHeight * devicePixelRatio;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
    if (once !== true) keyboardLook();
    fov = parseFloat(el("fov").value);
    const basis = viewBasis();
    // a verification draw (once) pins the scene: it never advances time
    if (once !== true) {
      if (camera.active) flightStep(basis.fwd, basis.right);
      else fallStep();
    }
    const R = camera.R;
    el("spdval").textContent = fmtRate();
    el("Rval").textContent = R < 0.1 ? R.toPrecision(2)
      : R < 1e4 ? R.toFixed(2) : R.toExponential(3);
    el("fovval").textContent = fov.toFixed(0);

    const aHat = scale(-1, camera.rHat);
    const betaVec = camera.active ? (camera.interior ? lemaitreBeta() : flightBeta())
      : ((el("ffo").checked && R > 1.0) ? scale(Math.sqrt(1 / R), aHat) : [0, 0, 0]);
    lastBeta = betaVec;

    gl.uniform1f(U("uR"), R);
    gl.uniform1f(U("uTanHalf"), Math.tan(fov * Math.PI / 360));
    gl.uniform1f(U("uAspect"), w / h);
    gl.uniform3fv(U("uFwd"), basis.fwd);
    gl.uniform3fv(U("uRight"), basis.right);
    gl.uniform3fv(U("uUp"), basis.up);
    gl.uniform3fv(U("uBhat"), aHat);
    gl.uniform3fv(U("uBeta"), betaVec);
    gl.uniform1i(U("uFFO"), (!camera.active && el("ffo").checked) ? 1 : 0);
    gl.uniform1i(U("uFlying"), camera.active ? 1 : 0);
    gl.uniform1i(U("uFlyIn"), (camera.active && camera.interior) ? 1 : 0);
    gl.uniform1i(U("uDop"), el("dop").checked ? 1 : 0);
    gl.uniform1i(U("uEternal"), el("eternal").checked ? 1 : 0);
    gl.uniform1i(U("uDisk"), el("disk").checked ? 1 : 0);
    gl.uniform1i(U("uSkyImage"),
                 (el("sky").value === "milkyway" && skyState === "ready") ? 1 : 0);
    const inc = parseFloat(el("inc").value) * Math.PI / 180;
    el("incval").textContent = el("inc").value;
    gl.uniform3fv(U("uZd"), [0, Math.sin(inc), Math.cos(inc)]);
    gl.uniform1f(U("uDiskAtabR"), Number.isFinite(diskKnobs.diskAtabR)
      ? Math.max(diskKnobs.diskAtabR, 2.5) : 1e30);
    gl.uniform1f(U("uDiskRmin"), diskKnobs.diskRmin);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    frames++;
    const now = performance.now();
    if (now - t0 > 500) { fps = frames * 1000 / (now - t0); frames = 0; t0 = now; }
    const rsSec = RS_SEC[el("mass").value];
    const tauIn = 2 / 3 * Math.pow(R, 1.5);
    const tauHor = 2 / 3 * (Math.pow(R, 1.5) - 1);
    const betaMag = norm(betaVec);
    const tauFly = (camera.active && R < 1.0) ? tauToSingularity(R, camera.E, camera.L) : 0;
    const hudPre = camera.active
      ? (camera.interior
          ? `${t("hudFlyIn")}   r = ${el("Rval").textContent} rS` +
            `${R < 1.0 ? "   ⚫ inside the horizon" : ""}   |beta| = ${betaMag.toFixed(3)}   ` +
            `E = ${camera.E.toFixed(4)}   L = ${camera.L.toFixed(4)}   ` +
            (R < 1.0 ? `tau to singularity = ${tauFly < 0.1 ? tauFly.toPrecision(2) : tauFly.toFixed(2)} rS/c (${fmtSec(tauFly * rsSec)})   ` : "")
          : `${t("hudFly")}   R = ${el("Rval").textContent} rS   |beta| = ${betaMag.toFixed(3)}   ` +
            `E = ${camera.E.toFixed(4)}   L = ${camera.L.toFixed(4)}   `)
      : R < 1.0
      ? `r = ${R < 0.1 ? R.toPrecision(2) : R.toFixed(3)} rS   ⚫ inside the horizon   ` +
        `tau to singularity = ${tauIn < 0.1 ? tauIn.toPrecision(2) : tauIn.toFixed(2)} rS/c (${fmtSec(tauIn * rsSec)})   `
      : `R = ${el("Rval").textContent} rS   beta = ` +
        `${betaMag.toFixed(3)}   ` +
        `tau to horizon = ${tauHor.toFixed(2)} rS/c (${fmtSec(tauHor * rsSec)})   `;
    // no static observer inside the horizon: the shader shows the FFO view
    const frameNote = (!camera.active && !el("ffo").checked && R <= 1.0)
      ? t("noStatic") + "   " : "";
    document.getElementById("hud").textContent = hudPre + frameNote +
      (camera.message ? camera.message + "   " : "") +
      `fps = ${fps.toFixed(0)}   ` +
      `f32 lookup err ~ ${meta.f32_bilinear_vs_exact_rad.toExponential(1)} rad`;
    if (once !== true) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}
main().catch(e => {
  document.getElementById("hud").textContent = t("error") + e.message;
  console.error(e);
});
</script>
</body>
</html>
